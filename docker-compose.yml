# Docker Compose for Universal H5P Server
#
# This sets up the H5P server for integration with any backend.
# Pass H5P_BASE_URL to set the public URL for asset loading.

services:
  h5p-server:
    build:
      context: ./h5p-server
      dockerfile: Dockerfile
    image: h5p-integration-kit/h5p-server:local
    # Run as current user to avoid permission issues with mounted volumes
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - H5P_BASE_URL=${H5P_BASE_URL:-http://localhost:3000}
      - H5P_DATA_PATH=/data/h5p
    volumes:
      # For development: mount local h5p directory
      # Everything the server persists lives below this path - libraries, content, and
      # the saved states of the learners in userdata/. Keeping the mount is what makes
      # those states survive a container rebuild or update.
      - ./h5p-server/h5p:/data/h5p
      # For production: use named volume instead
      # - h5p_data:/data/h5p
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # One-shot job: installs the H5P interaction types from the H5P Hub as soon as the
  # server is healthy. A fresh deployment has an empty library store and the H5P server
  # never fetches missing libraries by itself, so without this step the first content
  # registered via the API fails with "install-missing-libraries".
  #
  # Idempotent - content types that are already present are skipped, so it can run on
  # every `docker compose up`. Set H5P_BOOTSTRAP_LIBRARIES to a comma separated list of
  # machine names to install only a subset instead of the whole Hub catalogue.
  h5p-bootstrap:
    build:
      context: ./h5p-server
      dockerfile: Dockerfile
    image: h5p-integration-kit/h5p-server:local
    depends_on:
      h5p-server:
        condition: service_healthy
    environment:
      # Reached over the compose network, so this is independent of H5P_BASE_URL
      - H5P_SERVER_URL=http://h5p-server:3000
      - H5P_BOOTSTRAP_LIBRARIES=${H5P_BOOTSTRAP_LIBRARIES:-all}
      - H5P_BOOTSTRAP_RETRIES=${H5P_BOOTSTRAP_RETRIES:-3}
      - H5P_BOOTSTRAP_UPDATE=${H5P_BOOTSTRAP_UPDATE:-false}
    command: [ "node", "src/bootstrap-libraries.js" ]
    restart: "no"

volumes:
  h5p_data:
    driver: local
